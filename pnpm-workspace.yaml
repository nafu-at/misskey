packages:
  - packages/backend
  - packages/frontend-shared
  - packages/frontend
  - packages/frontend-builder
  - packages/frontend-embed
  - packages/i18n
  - packages/icons-subsetter
  - packages/sw
  - packages/misskey-js
  - packages/misskey-js/generator
  - packages/misskey-reversi
  - packages/misskey-bubble-game
  - packages-private/*
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@sentry/profiling-node': true
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/node-cpu-profiler': true
  bufferutil: true
  canvas: true
  core-js: true
  esbuild: true
  libpq: true
  msgpackr-extract: true
  msw: true
  nice-napi: true
  re2: true
  sharp: true
  utf-8-validate: true
  v-code-diff: true
  vue-demi: true
  exifreader: false
  protobufjs: false
minimumReleaseAge: 10080 # delay 7days to mitigate supply-chain attack
minimumReleaseAgeExclude:
  - '@misskey-dev/*'
  - '@syuilo/aiscript'
  - buraha
  - mfm-js
  - slacc
  - slacc-android-arm-eabi
  - slacc-android-arm64
  - slacc-darwin-arm64
  - slacc-darwin-universal
  - slacc-darwin-x64
  - slacc-freebsd-x64
  - slacc-linux-arm-gnueabihf
  - slacc-linux-arm64-gnu
  - slacc-linux-arm64-musl
  - slacc-linux-x64-gnu
  - slacc-linux-x64-musl
  - slacc-win32-arm64-msvc
  - slacc-win32-x64-msvc
  - '@typescript/native-preview*'
  - vite # そのうち消す
  # Renovate security update: typeorm@1.1.0
  - typeorm@1.1.0
  # Renovate security update: tar@7.5.21
  - tar@7.5.21
overrides:
  '@aiscript-dev/aiscript-languageserver': '-'
  '@peculiar/asn1-ecc': 2.6.1
  '@peculiar/asn1-rsa': 2.6.1
  '@peculiar/asn1-schema': 2.6.0
  '@peculiar/asn1-x509': 2.6.1
  '@redocly/openapi-core>js-yaml': 4.3.2
  '@misskey-dev/summaly>fastify': 5.12.8
  '@storybook/addon-actions>uuid': 11.1.1
  '@syuilo/aiscript>uuid': 11.1.1
  '@tabler/icons-webfont>sharp': '-'
  'brace-expansion@>=1 <1.1.21': 1.1.21
  'bullmq>ioredis': 5.11.1
  chokidar: 5.0.0
  'gaxios>rimraf': 6.1.4
  'js-beautify>glob': 14.0.6
  'immutable@>=5 <5.1.8': 5.1.9
  lodash: 4.18.1
  'minimatch@>=9 <11.0.1': 11.0.8

patchedDependencies:
  '@misskey-dev/summaly@5.5.1': patches/@misskey-dev__summaly@5.5.1.patch
  pg-pool@3.14.0: patches/pg-pool@3.14.0.patch
  typeorm: patches/typeorm.patch
engineStrict: true
saveExact: true
shellEmulator: true
